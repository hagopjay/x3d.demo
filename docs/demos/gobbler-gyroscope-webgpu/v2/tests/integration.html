<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Swarm integration harness</title>
<style>body{margin:0;background:#000;color:#efe9de;font:13px ui-monospace,monospace}#stage{position:relative;width:960px;height:540px}#swarm-canvas{position:absolute;inset:0;width:100%;height:100%}pre{padding:10px}</style></head>
<body><div id="stage"><canvas id="swarm-canvas"></canvas></div><pre id="log"></pre>
<script src="../swarm/model.js"></script><script src="../swarm/gpu.js"></script><script src="../swarm/gl.js"></script><script src="../swarm/swarm.js"></script>
<script>
/* Stands in for the v2 page's Babylon body without Babylon: one GPUDevice, a kinetics StorageBuffer-like object whose
   getBuffer().underlyingResource is a real GPUBuffer (10 x KinLoop, 80 bytes), a scene whose onAfterRenderObservable we tick,
   and a camera matrix in WebGPU clip space. Checks that the integrated path binds the shared buffer and draws. */
(async () => {
  const log = (s) => document.getElementById('log').textContent += s + '\n';
  const res = window.__integration = { steps: [] };
  try {
    GobblerSwarmGPU.capture = true;                          // this rig cannot present a WebGPU swap chain
    const ad = await navigator.gpu.requestAdapter(), device = await ad.requestDevice();
    const kin = device.createBuffer({ size: 800, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC });
    const S0 = GobblerSwarm, m = S0.mat, cbs = [];
    const C = S0.CENTER, eye = [C[0] + 2.5, C[1] + 3, C[2] + 11];
    const vp = m.mul(m.persp(0.9, 960 / 540, 0.1, 400, true), m.look(eye, C, [0, 1, 0]));
    const kinData = new Float32Array(200);
    const canvas = document.getElementById('swarm-canvas'); canvas.width = 960; canvas.height = 540;
    window.GobblerKinetics = { __G: { kinLoops: { getBuffer: () => ({ underlyingResource: kin }) }, mirror: kinData } };
    window.__gobWebGPU = { body: {
      engine: { _device: device, getRenderingCanvas: () => canvas },
      scene: { onAfterRenderObservable: { add: (f) => cbs.push(f) }, getTransformationMatrix: () => ({ m: vp }), activeCamera: { globalPosition: { x: eye[0], y: eye[1], z: eye[2] } },
        getTransformNodeByName: () => ({ computeWorldMatrix: () => ({ m: m.ident() }) }) } } };
    // the "Babylon" side writes its hoop matrices: here each hoop just turns about its own normal
    const t0 = performance.now();
    const writeKin = () => {
      const t = (performance.now() - t0) / 1000;
      S0.RINGS.forEach(([, n], k) => { let M = m.mul(m.trans(C), m.mul(m.rot(n, (k % 2 ? 1 : -1) * 0.3 * t), m.trans(C.map((x) => -x)))); kinData.set(M, k * 20); kinData.set([1, ...C], k * 20 + 16); });
      device.queue.writeBuffer(kin, 0, kinData);
    };
    writeKin();
    const st = await S0.start({ canvas, waitMs: 3000 });
    res.steps.push(['start', st]);
    let frames = 0;
    const tick = () => { writeKin(); cbs.forEach((f) => f()); frames++; if (frames < 400) setTimeout(tick, 30); };
    tick();
    await new Promise((r) => setTimeout(r, 9000));
    const R = S0.renderer();
    res.final = { stats: S0.stats(), captures: R.captures, kinIsShared: R.kin === kin, frames, kpi: S0.kpi && { cycles: S0.kpi.cycles, commits: S0.kpi.commits } };
    const px = canvas.getContext('2d').getImageData(0, 0, 960, 540).data; let lit = 0; for (let i = 0; i < px.length; i += 4) if (px[i] + px[i + 1] + px[i + 2] > 30) lit++;
    res.final.litPixels = lit;
    log(JSON.stringify(res, null, 1));
  } catch (e) { res.error = String(e.stack || e); log(res.error); }
  res.done = true;
})();
</script></body></html>
