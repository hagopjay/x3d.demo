<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gobbler Swarm · the Gobbler returns</title>
<link rel="stylesheet" href="swarm/swarm.css"><link rel="stylesheet" href="swarm/pipe.css"><link rel="stylesheet" href="ouro/ouro.css"><link rel="stylesheet" href="ouro/v5.css">
<style>html,body{margin:0;height:100%;background:#030407;color:#efe9de;font:14px/1.45 system-ui,sans-serif;overflow:hidden}#swarm-canvas{position:fixed;inset:0;width:100%;height:100%;display:block}</style>
</head><body class="swarm-solo">
<canvas id="swarm-canvas"></canvas>
<script src="swarm/model.js"></script><script src="swarm/gpu.js"></script><script src="swarm/gl.js"></script><script src="swarm/swarm.js"></script><script src="swarm/hud.js"></script><script src="swarm/pipe.js"></script><script src="ouro/ouro.js"></script><script src="ouro/ouro-hud.js"></script><script src="ouro/v5.js"></script>
<script>GobblerSwarm.start({ canvas: document.getElementById('swarm-canvas'), solo: true }).then(() => { if (window.GobblerSwarmHUD) GobblerSwarmHUD.mount(document.body, { solo: true, full: true }); if (window.GobblerSwarmPipe) GobblerSwarmPipe.mount(document.body, { solo: true });
  document.body.classList.add('ouro'); const sl = document.getElementById('swarm-lab'); if (sl) sl.classList.add('folded');
  if (window.GobblerOuroboros) GobblerOuroboros.start(document.body).then((o) => { if (o.ready) { GobblerOuroborosHUD.mount(document.body, { solo: true }); if (window.GobblerV5) GobblerV5.start(document.body, { solo: true }); } }); });</script>
</body></html>
