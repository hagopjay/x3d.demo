<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>X3DOM leg</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/x3dom@1.8.3/x3dom.css"><script src="https://cdn.jsdelivr.net/npm/x3dom@1.8.3/x3dom.js"></script>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}x3d{display:block;border:0;width:100%;height:100%}</style></head><body>
<x3d id="x" width="100%" height="100%" showStat="false" showLog="false"><scene id="sc"></scene></x3d>
<script>(async()=>{const txt=await (await fetch('../assets/orrery.x3d')).text();const src=new DOMParser().parseFromString(txt,'text/xml').querySelector('Scene');
const sc=document.getElementById('sc');for(const n of Array.from(src.childNodes)){if(n.nodeType===1)sc.appendChild(document.importNode(n,true));}x3dom.reload();parent.postMessage({leg:'x3dom',engine:'X3DOM 1.8.3'},'*');})();</script></body></html>
