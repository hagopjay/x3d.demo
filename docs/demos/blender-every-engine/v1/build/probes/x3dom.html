<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}x3d{display:block;border:0}</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/x3dom@1.8.3/x3dom.css"><script src="https://cdn.jsdelivr.net/npm/x3dom@1.8.3/x3dom.js"></script></head><body>
<x3d id="x" width="960px" height="540px" showStat="false" showLog="false"><scene id="sc"></scene></x3d>
<script>
const names=fetch('interps.json').then(r=>r.json());
window.go=async(url)=>{const txt=await (await fetch(url)).text();const doc=new DOMParser().parseFromString(txt,'text/xml');const src=doc.querySelector('Scene');
 const sc=document.getElementById('sc');
 // X3DOM reads the scene from the page DOM: copy the X3D Scene children in as they are
 for(const n of Array.from(src.childNodes)){if(n.nodeType===1)sc.appendChild(document.importNode(n,true));}
 x3dom.reload();await new Promise(r=>setTimeout(r,3000));
 const t=document.querySelector('[DEF="SceneTimer"]');if(t)t.setAttribute('enabled','false');window.engine='X3DOM '+((x3dom.versionInfo&&x3dom.versionInfo.version)||x3dom.version||'1.8.3');return window.engine;};
window.at=async(f)=>{for(const n of await names){const e=document.querySelector('[DEF="'+n+'"]');if(e)e.setAttribute('set_fraction',String(f));}};
</script></body></html>
