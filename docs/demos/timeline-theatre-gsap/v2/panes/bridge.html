<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#04060c;overflow:hidden}canvas{width:100%;height:100%;display:block}#m{position:absolute;inset:0;display:grid;place-items:center;color:#97a3c0;font:13px ui-monospace,monospace}</style></head>
<body><canvas id="c" width="960" height="720"></canvas><div id="m">loading three.js r187 and the bridge body</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js';
window.THREE = THREE;
const add = (src) => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.body.appendChild(s); });
try {
  await add('bridge-body.js');
  const body = new Body(document.getElementById('c'), { tone: 'none', fontBase: '', onNote: () => {} }); await body.init(); X3DSAI.setBody(body);
  window.ENGINE = { name: 'bridge', async load(xml) { const B = X3DSAI.B, sc = await B.createX3DFromString(xml); await B.replaceWorld(sc); await B.nextFrame(); return sc; } };
  await add('pane.js'); document.getElementById('m').remove(); window.__panePost({ ready: true, version: 'r' + THREE.REVISION, engine: 'three.js bridge' });
} catch (e) { document.getElementById('m').textContent = 'the bridge pane could not start: ' + e.message + ' (it loads three.js from jsDelivr)'; parent.postMessage({ pane: 'bridge', error: String(e.message) }, '*'); }
</script></body></html>
