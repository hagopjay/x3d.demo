<!doctype html><meta charset="utf-8"><title>SLAB GPU vs CPU gate</title>
<script type="module">
import { disc } from '../src/sim/cases.js';
import { GpuMpm } from '../src/gpu/mpm-gl.js';
const q = new URLSearchParams(location.search), steps = Number(q.get('steps') || 300);
const gl = document.createElement('canvas').getContext('webgl2');
function compare(twin) {
  const cpu = disc({ gravity: [0, -9.81], floor: true });
  const gsim = disc({ gravity: [0, -9.81], floor: true, twin });
  const gpu = new GpuMpm(gl, gsim);
  const t0 = performance.now(); gpu.step(steps); const a = gpu.read(0); const gms = performance.now() - t0;
  const t1 = performance.now(); for (let i = 0; i < steps; i++) cpu.step(); const cms = performance.now() - t1;
  let dx = 0, dv = 0;
  for (let p = 0; p < cpu.n; p++) {
    dx = Math.max(dx, Math.abs(a[p * 4] - cpu.x[p]), Math.abs(a[p * 4 + 1] - cpu.y[p]));
    dv = Math.max(dv, Math.abs(a[p * 4 + 2] - cpu.vx[p]), Math.abs(a[p * 4 + 3] - cpu.vy[p]));
  }
  return { particles: cpu.n, steps, max_dx_m: dx, max_dv_mps: dv, gpu_ms: +gms.toFixed(1), cpu_ms: +cms.toFixed(1), finite: Number.isFinite(dx + dv) };
}
try {
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  window.__gate = { renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER), userAgent: navigator.userAgent,
    float32: compare(null), pic_twin: compare('pic') };
} catch (e) { window.__gate = { error: String(e.stack || e) }; }
</script>
