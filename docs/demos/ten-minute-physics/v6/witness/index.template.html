<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ten Minute Physics in X3D, batch 6</title>
<script src="https://cdn.jsdelivr.net/npm/x_ite@16.7.1/dist/x_ite.min.js"></script>
<style>:root{--bg:#0b0e14;--fg:#dfe6f0;--mut:#8b97a8;--ac:#4cc9f0;--card:#141a24}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:16px}h1{font-size:22px;margin:.2em 0}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button{background:var(--card);color:var(--fg);border:1px solid #2a3446;border-radius:8px;padding:8px 14px;cursor:pointer}button.on{border-color:var(--ac);color:var(--ac)}
x3d-canvas{width:100%;height:56vh;min-height:320px;display:block;border-radius:10px;background:#000}.card{background:var(--card);border-radius:10px;padding:12px 16px;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #263044;padding:4px 8px;text-align:left;vertical-align:top}small{color:var(--mut)}a{color:var(--ac)}h3{margin:.8em 0 .2em;font-size:16px}</style></head><body><main>
<h1>Ten Minute Physics in X3D · batch 6</h1>
<small>Independent ports of ideas from Matthias Mueller's Ten Minute Physics; no code copied (NOTICE.md). Files are 0.1 to 6 MB; give them a few seconds. <a href="NOTES.md">Notes</a> · <a href="FIELD-GUIDE.md">Field guide</a> · <a href="../v5/ERRATA-v1-v4.md">Errata for v1 to v4</a> · <a href="../v5/index.html">batch 5 page</a></small>
<nav id="tabs"></nav><x3d-canvas id="c"></x3d-canvas><div class="card" id="txt"></div>
<div class="card" id="numcard"><b>Numbers</b> <small>(__NUMBERS_NOTE__)</small><table id="nums"></table></div>
</main><script>
const D=__DATA__;
const c=document.getElementById('c'),tabs=document.getElementById('tabs');
function show(i){[...tabs.children].forEach((b,j)=>b.classList.toggle('on',i==j));if(D[i].f)c.setAttribute('src',D[i].f);c.style.display=D[i].f?'block':'none';
 document.getElementById('txt').innerHTML=D[i].x;document.getElementById('numcard').style.display=D[i].n.length?'block':'none';document.getElementById('nums').innerHTML=D[i].n.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}
D.forEach((d,i)=>{const b=document.createElement('button');b.textContent=d.t;b.onclick=()=>show(i);tabs.appendChild(b)});show(0);
</script></body></html>
